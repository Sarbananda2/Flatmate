name: CD - Deploy to AWS Lightsail

# Deploys only what has passed CI: after the CI workflow succeeds on main, or
# when started by hand from the Actions tab.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a newer one waits rather than cutting one short.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      # Until the server exists and its secrets are added, there is nothing to
      # deploy to: say so instead of failing on every push.
      SERVER_CONFIGURED: ${{ secrets.LIGHTSAIL_HOST != '' && secrets.LIGHTSAIL_SSH_KEY != '' }}
      # The commit CI tested (or, run by hand, the tip of the chosen branch).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Nothing to deploy to yet
        if: env.SERVER_CONFIGURED != 'true'
        run: >-
          echo "::notice::LIGHTSAIL_HOST and LIGHTSAIL_SSH_KEY are not set, so nothing was
          deployed. Add them under Settings > Secrets and variables > Actions
          (see deploy/DEPLOY_AWS_LIGHTSAIL.md)."

      - name: Deploy to AWS Lightsail via SSH
        if: env.SERVER_CONFIGURED == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            set -e
            cd /home/ubuntu/aem
            echo "==> Fetching $DEPLOY_SHA"
            git fetch --quiet origin main
            git checkout --quiet --detach "$DEPLOY_SHA"
            echo "==> Rebuilding and restarting the containers (migrations run as the app starts)"
            docker compose -f docker-compose.prod.yml up -d --build
            docker compose -f docker-compose.prod.yml ps
            echo "==> Waiting for the app to answer"
            for attempt in $(seq 1 30); do
              if docker compose -f docker-compose.prod.yml exec -T app \
                   curl -fsS http://127.0.0.1:8787/health >/dev/null 2>&1; then
                echo "==> Deployed $DEPLOY_SHA"
                exit 0
              fi
              sleep 5
            done
            echo "The app did not come up healthy; recent logs:" >&2
            docker compose -f docker-compose.prod.yml logs --tail 50 app >&2
            exit 1
