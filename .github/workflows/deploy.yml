name: CD - Publish to AWS App Runner

# Publishes only what has passed CI: after the CI workflow succeeds on main, or
# when started by hand from the Actions tab. The image goes to Amazon ECR as
# :<commit> and :latest; App Runner deploys each new :latest by itself.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One publish at a time; a newer one waits rather than cutting one short.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # to sign in to AWS with GitHub's OIDC token: no stored AWS keys
  contents: read

jobs:
  publish:
    name: Build and publish the image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'flatmate-app' }}
      # The commit CI tested (or, run by hand, the tip of the chosen branch).
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Nothing to publish to yet
        if: vars.AWS_DEPLOY_ROLE_ARN == ''
        run: >-
          echo "::notice::The repository variable AWS_DEPLOY_ROLE_ARN is not set, so nothing
          was published. See deploy/DEPLOY_AWS_APPRUNNER_RDS.md."

      - name: Check out the tested commit
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Sign in to AWS
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          # A plain image manifest: App Runner does not need attestations.
          provenance: false
          sbom: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Published
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        run: echo "::notice::Published ${{ env.ECR_REPOSITORY }}:${{ env.DEPLOY_SHA }} as :latest; App Runner deploys it."
