name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Run by hand from the Actions tab

jobs:
  backend-test:
    name: Backend Tests & Quality Gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aem_test
          POSTGRES_USER: aem_owner
          POSTGRES_PASSWORD: test_migration_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      AEM_DB_HOST: 127.0.0.1
      AEM_DB_PORT: 5432
      AEM_DB_NAME: aem_test
      AEM_DB_USER: aem
      AEM_DB_PASSWORD: test_runtime_password
      AEM_DB_MIGRATION_USER: aem_owner
      AEM_DB_MIGRATION_PASSWORD: test_migration_password
      AEM_TEST_DB_NAME: aem_test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          # There is no requirements.txt: the dependencies are in pyproject.toml.
          cache-dependency-path: pyproject.toml

      - name: Create runtime postgres role
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U aem_owner -d aem_test -c "
            DO \$\$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'aem') THEN
                CREATE ROLE aem LOGIN PASSWORD 'test_runtime_password';
              END IF;
            END
            \$\$;
            GRANT ALL PRIVILEGES ON DATABASE aem_test TO aem_owner;
            GRANT CONNECT ON DATABASE aem_test TO aem;
          "

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Run backend tests
        run: |
          pytest tests legacy -q

  frontend-test:
    name: Frontend Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: aem:test
