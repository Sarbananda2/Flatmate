[project]
name = "apartment-expense-manager"
version = "1.0.0"
description = "Local-first household expense accounting for a shared apartment."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Only needed to read smart plugs through POST /api/electricity/sync-tapo.
tapo = ["tapo>=0.11"]

[tool.pytest.ini_options]
# The whole suite: the new tests under ./tests, and the original prototype's
# unittest modules at the repository root, which pytest collects natively.
testpaths = ["tests", "."]
norecursedirs = [
    ".venv", "venv", "node_modules", "frontend",
    "data", "backups", "__pycache__", ".git",
]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore::UserWarning",
]
