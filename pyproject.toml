[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apartment-expense-manager"
version = "1.0.0"
description = "Local-first household expense accounting for a shared apartment."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    # The PostgreSQL driver and its connection pool. "binary" bundles libpq.
    "psycopg[binary,pool]>=3.2",
    # Multipart form parsing, for document uploads.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Only needed to read smart plugs through POST /api/electricity/sync-tapo.
tapo = ["tapo>=0.11"]

# Only ``aem`` is the installable package. Without this, setuptools sees the
# other top-level directories (data, backups, frontend, legacy) and refuses to
# build, which is what made ``pip install -e '.[dev]'`` fail.
[tool.setuptools.packages.find]
include = ["aem*"]

# The SQL migrations are read from inside the package at run time.
[tool.setuptools.package-data]
aem = ["**/*.sql"]

[tool.pytest.ini_options]
# The whole suite: the application's tests under ./tests, and the original
# prototype's unittest modules under ./legacy, which pytest collects natively.
testpaths = ["tests", "legacy"]
pythonpath = ["."]
norecursedirs = [
    ".venv", "venv", "node_modules", "frontend",
    "data", "backups", "__pycache__", ".git",
]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:DeprecationWarning",
    "ignore::UserWarning",
]
