    <script>
      // Apply the saved theme before first paint so the page never flashes.
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('aem.theme') === 'light' ? 'light' : 'dark'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
